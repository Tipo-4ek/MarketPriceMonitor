[tool.poetry]
name = "market-price-monitor"
version = "0.1.0"
description = "Telegram bot for tracking prices across marketplaces"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "bot"}]

[tool.poetry.dependencies]
python = "^3.12"
aiogram = "^3.13.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.35"}
asyncpg = "^0.29.0"
aiosqlite = "^0.20.0"
alembic = "^1.13.3"
pydantic-settings = "^2.6.0"
playwright = "^1.48.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.7.4"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "Q", "E1", "E2", "E3", "T20"]
# The formatter owns line width; E501 on long string literals (user-agents,
# i18n messages) is noise it can't fix, so we don't lint it.
ignore = ["E501"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

