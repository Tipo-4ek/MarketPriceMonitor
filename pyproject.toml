[project]
name = "market-price-monitor"
version = "0.1.0"
description = "Telegram price-tracking bot with a pluggable marketplace-provider architecture"
authors = [{ name = "Ilya Lyubimov", email = "Tipo_4ek@inbox.ru" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "aiogram (>=3.30.0,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "playwright (>=1.62.0,<2.0.0)",
]

[project.urls]
Repository = "https://github.com/Tipo-4ek/MarketPriceMonitor"

[project.scripts]
market-price-monitor = "bot.core.startup:run"
market-price-check = "bot.cli:main"

[dependency-groups]
dev = [
    "ruff (>=0.16.2,<0.17.0)",
    "mypy (>=1.11.0,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
]

[tool.poetry]
packages = [{ include = "bot" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "Q", "T20", "UP", "B", "ASYNC", "SIM", "RUF",
    # Correctness- and clarity-focused sets the tree already passes clean:
    "DTZ",   # naive datetimes — this project is timezone-aware throughout
    "LOG", "G",  # logging: no f-strings / % in log calls, structured extras only
    "PERF",  # obvious performance anti-patterns
    "C4", "PIE", "RET", "FLY", "SIM",  # comprehensions, returns, misc simplification
    "ICN", "TID", "TC",  # import conventions, tidy imports, type-checking imports
    "N",     # pep8 naming
    "PGH",   # blanket noqa / type-ignore hygiene
    "SLOT", "INT",
]
ignore = [
    # The formatter owns line width; E501 on long string literals (i18n
    # messages, page fixtures) is noise it cannot fix.
    "E501",
    # This bot speaks Russian and parses Russian pages, so Cyrillic in string
    # literals is the point. The confusable-character rules would fire on
    # essentially every user-facing message and every page fixture.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
files = ["bot", "scripts"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=bot --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["bot"]
branch = true

[tool.coverage.report]
show_missing = true
# Entry points and the browser transport are exercised by hand against a live
# marketplace (market-price-check), not in the network-free unit suite.
omit = ["bot/core/startup.py", "bot/core/providers/browser.py"]
