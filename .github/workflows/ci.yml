name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range pyproject declares, so the claim is checked
        # rather than asserted.
        python-version: ['3.13', '3.14']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Check that poetry.lock matches pyproject.toml
        run: poetry check --lock

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check --output-format=github .

      - name: Check formatting (ruff)
        run: poetry run ruff format --check .

      - name: Run tests
        run: poetry run pytest -q

  migrations:
    # The unit suite builds its schema from the models on SQLite, so it cannot
    # see a migration that has drifted from them. This runs the real migrations
    # against a real Postgres and asks Alembic whether anything differs.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # A throwaway service container on a private network: trust auth
          # means no password has to exist, let alone be committed.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: price_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --only main

      - name: Migrate and compare against the models
        env:
          DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/price_tracker
        run: poetry run python scripts/check_schema_drift.py

  docker:
    # The README documents a Docker path, so CI builds the image and runs the
    # suite inside it. A container that only builds on the author's laptop is
    # not a container anybody else can use.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the runtime image
        run: docker build --target runtime -t market-price-monitor:ci .

      - name: Build the test image and run the suite in it
        run: |
          docker build --target dev -t market-price-monitor:ci-dev .
          docker run --rm market-price-monitor:ci-dev
