# What this stack is and is not, measured rather than assumed:
#
# The bot runs here, migrations run here, the tests run here. Scraping does not.
# Both supported marketplaces refuse headless browsers, and the image has no
# real Chrome to fall back on, so providers will report themselves blocked and
# the health monitor will mark them DOWN — which is the correct behaviour, not a
# bug. For actual price tracking, run the bot on a desktop host with Chrome
# installed (see README, "Running").

services:
  db:
    image: postgres:18-alpine
    container_name: market_price_monitor_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-price_tracker}
    # No host port mapping: the DB is only reached by the bot over the compose
    # network. Uncomment to expose it for local inspection.
    # ports:
    #   - "5432:5432"
    volumes:
      # Postgres 18 images want a single mount at /var/lib/postgresql and place
      # the cluster in a version-specific subdirectory; mounting the old
      # .../data path makes the container refuse to start.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-price_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      target: runtime
    container_name: market_price_monitor_bot
    env_file:
      # Optional so `docker compose config` works on a fresh clone; the bot
      # still refuses to start without BOT_TOKEN.
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-price_tracker}
      # No real Chrome in the image, and no display: use the bundled Chromium
      # headless. See the note at the top about what that means for scraping.
      BROWSER_CHANNEL: ''
      HEADLESS_ENABLED: 'true'
    depends_on:
      db:
        condition: service_healthy
    # on-failure, not unless-stopped: starting without a BOT_TOKEN is a
    # configuration mistake that exits immediately, and restarting it forever
    # would bury the one line saying what to fix under a scrolling loop.
    restart: on-failure:3

  tests:
    build:
      context: .
      target: dev
    container_name: market_price_monitor_tests
    # Tests use an in-memory SQLite DB, so no database service is needed.
    profiles:
      - test

volumes:
  # Renamed with the mount-point change so an old PG16 volume is left alone
  # rather than silently reinterpreted by a newer server.
  postgres_data:
    name: market_price_monitor_pgdata_18
